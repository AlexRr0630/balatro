<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>小丑牌 · Balatro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#100a1a;--bg2:#1a1028;--bg3:#241538;
  --red:#e74c3c;--gold:#f1c40f;--green:#2ecc71;--blue:#3498db;--purple:#9b59b6;
  --chip:#27ae60;--mult:#e74c3c;--text:#e8d8f0;--text2:#a088c0;--card-front:#0d0a12;
  --u:clamp(12px,1.2vw,24px);--u2:clamp(9px,0.85vw,16px);--u3:clamp(7px,0.7vw,14px);
  --u4:clamp(14px,1.4vw,28px);--u5:clamp(20px,2vw,40px);--u6:clamp(28px,2.8vw,56px);
  --cw:clamp(72px,8vw,120px);--ch:clamp(100px,11vw,160px);
  --jw:clamp(80px,10vw,160px);--bh:clamp(36px,5vh,50px);
}
html,body{background:var(--bg);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden;overflow-y:auto;user-select:none;color:var(--text);}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.06) 0px,rgba(0,0,0,0.06) 1px,transparent 1px,transparent 3px);}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(180,40,60,0.08),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(125,60,152,0.06),transparent 50%);}

#game-wrap{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;flex-direction:row;overflow-y:auto;}
#game-main{flex:1;display:flex;flex-direction:column;min-width:0;}
#effects-col{width:220px;border-left:1px solid rgba(155,89,182,0.15);background:rgba(26,16,40,0.6);padding:var(--u3);overflow-y:auto;flex-shrink:0;}
.ef-title{font-size:var(--u4);font-weight:bold;color:var(--gold);font-family:monospace;margin-bottom:var(--u3);text-align:center;}
#ef-list{display:flex;flex-direction:column;gap:var(--u3);}
.ef-item{font-size:var(--u2);color:var(--text2);background:rgba(36,21,56,0.4);border:1px solid rgba(155,89,182,0.1);border-radius:4px;padding:var(--u3);line-height:1.3;}
.ef-item-cat{font-size:var(--u3);font-weight:bold;color:var(--gold);margin-bottom:var(--u3);}
.ef-item-line{margin-bottom:var(--u3);}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:var(--u3) var(--u2);border-bottom:1px solid rgba(155,89,182,0.12);font-family:monospace;}
.blind-name{font-size:var(--u4);color:var(--text);text-shadow:0 0 8px rgba(155,89,182,0.2);}
.blind-info{font-size:var(--u2);color:var(--text2);}

#joker-col{display:flex;flex-direction:row;gap:var(--u3);padding:var(--u3);overflow-x:auto;overflow-y:hidden;border-bottom:1px solid rgba(155,89,182,0.12);min-height:90px;max-height:110px;background:rgba(16,8,26,0.3);}
.joker-slot{min-height:80px;width:90px;background:rgba(26,16,40,0.7);border:2px solid rgba(155,89,182,0.2);border-radius:8px;padding:var(--u3) var(--u2);display:flex;flex-direction:column;align-items:center;gap:var(--u3);transition:all 0.2s;position:relative;overflow:hidden;cursor:grab;flex-shrink:0;}
.joker-slot::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(155,89,182,0.08),transparent);pointer-events:none;}
.joker-slot:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(241,196,15,0.25);}
.joker-slot.dragging{opacity:0.4;border-color:var(--gold);}
.joker-slot.ed-foil{border-color:#c49614;box-shadow:0 0 10px rgba(196,150,20,0.35);}
.joker-slot.ed-holographic{border-color:#5dade2;box-shadow:0 0 10px rgba(93,173,226,0.35);}
.joker-slot.ed-polychrome{border-color:#e74c3c;box-shadow:0 0 12px rgba(231,76,60,0.35);}
.joker-slot.ed-negative{border-color:#7f8c8d;box-shadow:0 0 10px rgba(127,140,141,0.35);background:rgba(40,40,40,0.4);}
.joker-slot.drag-over{border-color:var(--gold);box-shadow:0 0 18px rgba(241,196,15,0.35);transform:scale(1.05);}
.jk-emoji{font-size:var(--u5);}.jk-name{font-size:var(--u3);font-weight:bold;color:var(--gold);text-align:center;line-height:1.1;}
.jk-desc{font-size:var(--u2);color:var(--text2);text-align:center;line-height:1.2;}
.jk-num{position:absolute;top:2px;left:4px;font-size:var(--u2);color:var(--gold);font-family:monospace;opacity:0.5;}
.joker-empty{width:90px;min-height:80px;border:1px dashed rgba(155,89,182,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:var(--u3);color:rgba(155,89,182,0.25);font-family:monospace;background:rgba(26,16,40,0.3);flex-shrink:0;}

#play-area{padding:var(--u3);gap:var(--u3);display:flex;flex-direction:column;flex:1;}
#score-box{padding:var(--u3) var(--u2);background:rgba(26,16,40,0.5);border:1px solid rgba(155,89,182,0.1);border-radius:8px;text-align:center;}
.sc-target{font-size:var(--u);color:var(--text2);font-family:monospace;margin-bottom:var(--u3);}
.sc-target b{color:var(--gold);font-size:var(--u4);}
.sc-nums{display:flex;justify-content:center;align-items:center;gap:var(--u3);font-family:monospace;}
.sc-chip{font-size:var(--u6);font-weight:bold;color:var(--chip);text-shadow:0 1px 4px rgba(39,174,96,0.2);transition:all 0.3s;}
.sc-mult{font-size:var(--u6);font-weight:bold;color:var(--mult);text-shadow:0 1px 4px rgba(192,57,43,0.2);transition:all 0.3s;}
.sc-x{font-size:var(--u4);color:var(--text2);}.sc-eq{font-size:var(--u4);color:var(--text2);}
.sc-tot{font-size:var(--u6);font-weight:bold;color:var(--gold);text-shadow:0 1px 4px rgba(212,160,23,0.2);transition:all 0.3s;}
.sc-bar{height:var(--u4);background:rgba(0,0,0,0.08);border-radius:var(--u2);margin-top:var(--u2);position:relative;overflow:hidden;}
.sc-bar-f{height:100%;border-radius:var(--u2);background:linear-gradient(90deg,var(--chip),var(--gold));transition:width 0.6s;}
.sc-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--u2);color:var(--gold);font-weight:bold;font-family:monospace;text-shadow:0 0 4px rgba(241,196,15,0.4);}
#hand-badge{text-align:center;font-size:var(--u);font-weight:bold;color:var(--gold);opacity:0;transition:opacity 0.3s;font-family:monospace;}
#hand-badge.show{opacity:1;}
#res-row{display:flex;gap:var(--u);justify-content:center;font-size:var(--u);font-family:monospace;}
.res-h{color:var(--blue);}.res-d{color:var(--mult);}.res-m{color:var(--gold);}

#sort-row{display:flex;gap:var(--u3);justify-content:center;padding:var(--u3) 0;}
.sort-btn{font-family:monospace;font-size:var(--u3);padding:2px var(--u3);border:1px solid rgba(155,89,182,0.2);border-radius:3px;cursor:pointer;background:rgba(26,16,40,0.4);color:var(--text2);transition:all 0.2s;}
.sort-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(36,21,56,0.5);}

#cards-row{display:flex;gap:var(--u3);justify-content:center;align-items:flex-end;padding:var(--u2) var(--u3);min-height:var(--ch);max-height:calc(var(--ch)*1.4);overflow-x:auto;}
#cards-row::-webkit-scrollbar{height:3px;}#cards-row::-webkit-scrollbar-thumb{background:rgba(155,89,182,0.2);border-radius:2px;}
#cons-row{display:flex;gap:var(--u3);justify-content:center;padding:var(--u2) 0;align-items:center;}
.cons-slot{width:90px;height:80px;background:rgba(26,16,40,0.6);border:2px dashed rgba(155,89,182,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-direction:column;gap:var(--u3);flex-shrink:0;}
.cons-slot.filled{border-style:solid;border-color:var(--purple);background:rgba(36,21,56,0.6);}
.cons-slot:hover:not(.empty){transform:scale(1.1);border-color:var(--gold);box-shadow:0 0 14px rgba(241,196,15,0.3);}
.cons-e{font-size:var(--u5);}
.cons-n{font-size:var(--u3);color:var(--text2);text-align:center;}
.cons-slot-joker{border-color:var(--gold);} .cons-slot-planet{border-color:#5dade2;} .cons-slot-tarot{border-color:var(--purple);}
.card{width:var(--cw);height:var(--ch);background:var(--card-front);border:2.5px solid rgba(241,196,15,0.3);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-weight:bold;box-shadow:0 3px 10px rgba(241,196,15,0.15),0 2px 6px rgba(0,0,0,0.5);flex-shrink:0;transition:transform 0.12s,border-color 0.12s,box-shadow 0.12s;}
.card::before{content:'';position:absolute;inset:4px;border:1.5px solid rgba(241,196,15,0.08);border-radius:7px;pointer-events:none;}
.card .cr{position:absolute;top:6px;left:7px;font-size:clamp(11px,1.3vw,16px);font-weight:bold;line-height:1;display:flex;flex-direction:column;align-items:center;gap:0;}
.card .cr .r{font-size:clamp(13px,1.5vw,18px);line-height:1;}
.card .cr .cr-s{font-size:clamp(11px,1.3vw,16px);line-height:1;}
.card .s-center{font-size:clamp(22px,3vw,36px);line-height:1;z-index:1;margin:0;}
.card .br{position:absolute;bottom:6px;right:7px;font-size:clamp(11px,1.3vw,16px);font-weight:bold;line-height:1;display:flex;flex-direction:column;align-items:center;gap:0;transform:rotate(180deg);}
.card .br .r{font-size:clamp(13px,1.5vw,18px);line-height:1;}
.card .br .br-s{font-size:clamp(11px,1.3vw,16px);line-height:1;}
.card.red{color:#e74c3c;text-shadow:0 0 6px rgba(231,76,60,0.3);}.card.black{color:var(--gold);text-shadow:0 0 4px rgba(241,196,15,0.2);}
.card.sel{transform:translateY(-8px) scale(1.04);border-color:var(--gold);box-shadow:0 10px 24px rgba(241,196,15,0.35),0 0 18px rgba(241,196,15,0.2);z-index:10;}
.card:hover:not(.sel){transform:translateY(calc(var(--u2)*-0.7));border-color:var(--gold);}
@keyframes flyOut{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-60px) scale(0.3);opacity:0}}
.card.fly{animation:flyOut 0.3s ease forwards;}
.card.enh-lucky{border-color:#2ecc71;box-shadow:0 0 10px rgba(46,204,113,0.4);}
.card.enh-mult{border-color:#e74c3c;box-shadow:0 0 10px rgba(231,76,60,0.3);}
.card.enh-bonus{border-color:#f1c40f;box-shadow:0 0 10px rgba(241,196,15,0.4);}
.card.enh-wild{border-color:#9b59b6;box-shadow:0 0 10px rgba(155,89,182,0.3);}
.card.enh-steel{border-color:#7f8c8d;box-shadow:0 0 10px rgba(127,140,141,0.5);}
.card.enh-glass{border-color:#3498db;box-shadow:0 0 10px rgba(52,152,219,0.5);}
.card.enh-gold{border-color:#f39c12;box-shadow:0 0 10px rgba(243,156,18,0.4);}
.card.enh-stone{border-color:#95a5a6;box-shadow:0 0 10px rgba(149,165,166,0.4);}

#btn-row{display:flex;gap:var(--u);justify-content:center;padding:var(--u3);}
.btn{font-family:monospace;font-size:var(--u);font-weight:bold;padding:var(--u) calc(var(--u)*1.5);border:2px solid;border-radius:5px;cursor:pointer;background:rgba(26,16,40,0.4);transition:all 0.2s;color:var(--text2);}
.btn:disabled{opacity:0.2;cursor:not-allowed;}
.btn-p{color:var(--chip);border-color:var(--chip);}.btn-p:hover:not(:disabled){background:rgba(39,174,96,0.15);box-shadow:0 0 12px rgba(39,174,96,0.2);}
.btn-d{color:var(--mult);border-color:var(--mult);}.btn-d:hover:not(:disabled){background:rgba(231,76,60,0.1);box-shadow:0 0 12px rgba(231,76,60,0.15);}

#preview-row{display:none;text-align:center;padding:var(--u2);font-family:monospace;}
#preview-row.show{display:block;}
.pv-text{font-size:var(--u3);color:var(--text2);}
.pv-score{font-size:var(--u5);color:var(--gold);font-weight:bold;text-shadow:0 0 10px rgba(241,196,15,0.3);}
.pv-label{font-size:var(--u2);color:var(--gold);opacity:0.7;}

#landscape-toggle{position:fixed;top:8px;left:8px;z-index:500;font-family:monospace;font-size:var(--u);font-weight:bold;padding:var(--u3) var(--u);background:rgba(240,230,246,0.95);border:2px solid var(--gold);color:var(--gold);border-radius:4px;cursor:pointer;transition:all 0.2s;display:none;}
@media(max-width:700px){
  #landscape-toggle{display:block;}
  #game-wrap{flex-direction:column;}
  #effects-col{width:100%;border-left:none;border-top:1px solid rgba(125,60,152,0.1);max-height:200px;}
}
body.force-landscape #game-wrap{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100vw);overflow-y:auto;z-index:10;}
body.force-landscape #landscape-toggle{position:fixed;top:8px;left:8px;transform:none;z-index:501;border-color:var(--mult);color:var(--mult);}
/* 横屏游戏区域 */
body.force-landscape #joker-col{min-height:36px;gap:2px;padding:2px 4px;}body.force-landscape #joker-col::-webkit-scrollbar{height:2px;}
body.force-landscape .joker-slot{min-height:30px;width:44px;padding:1px 2px;gap:0px;}
body.force-landscape .jk-emoji{font-size:12px;}.force-landscape .jk-name{font-size:6px;}.force-landscape .jk-desc{font-size:5px;}.force-landscape .jk-num{font-size:5px;}
body.force-landscape .joker-empty{min-height:30px;font-size:6px;}
body.force-landscape #play-area{padding:4px 6px;gap:2px;}
body.force-landscape #top-bar{padding:4px 6px;}
body.force-landscape .blind-name{font-size:12px;}.force-landscape .blind-info{font-size:9px;}
body.force-landscape #res-row{font-size:9px;gap:4px;}
body.force-landscape #btn-row{padding:2px;}.force-landscape .btn{font-size:10px;padding:4px 10px;}
body.force-landscape #cards-row{min-height:60px;max-height:80px;gap:2px;padding:2px;}
body.force-landscape .card{width:44px;height:60px;}.force-landscape .card .r{font-size:10px;}.force-landscape .card .s{font-size:14px;}.force-landscape .card .v{font-size:5px;}
/* 横屏overlay: 跟game-wrap一起旋转,内容横向布局适配窄视口 */
body.force-landscape .start-ov,body.force-landscape .ov{
  width:100vh;height:100vw;
  transform-origin:top left;
  transform:rotate(90deg) translateY(-100vw);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:6px 8px;
}
body.force-landscape #toast{
  transform:rotate(90deg) translateY(-100vw);
  width:100vh;left:0;top:auto;bottom:8px;
}
/* 横屏商店: 所有分类横排,卡片极紧凑 */
body.force-landscape .shop-it{width:64px;min-height:72px;padding:2px;gap:1px;border-radius:4px;}
body.force-landscape .si-e{font-size:18px;}
body.force-landscape .si-n{font-size:8px;line-height:1;}
body.force-landscape .si-d{font-size:7px;line-height:1;max-height:18px;overflow:hidden;}
body.force-landscape .si-p{font-size:9px;}
body.force-landscape .shop-t{font-size:13px;margin-bottom:3px;}
body.force-landscape .sb{font-size:11px;padding:6px 14px;border-radius:4px;}
body.force-landscape .shop-btns{margin-top:4px;gap:6px;}
/* 横屏评分/结果 */
body.force-landscape .sc-ov-title{font-size:18px;margin-bottom:6px;}
body.force-landscape .sc-ov-cards{gap:4px;flex-wrap:wrap;}
body.force-landscape .sc-ov-card{width:40px;height:56px;}
body.force-landscape .sc-ov-card .r{font-size:9px;}
body.force-landscape .sc-ov-card .s{font-size:13px;}
body.force-landscape .sc-ov-nums{font-size:20px;gap:6px;}
body.force-landscape .sc-ov-eq{font-size:12px;}
body.force-landscape .sc-ov-jk .jl{font-size:9px;padding:2px 6px;}
body.force-landscape .res-t{font-size:18px;}
body.force-landscape .res-s{font-size:11px;}
body.force-landscape .st-t{font-size:28px;}
body.force-landscape .st-s{font-size:12px;}
body.force-landscape .st-b{font-size:12px;padding:6px 16px;}

/* Overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,6,20,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--u);overflow-y:auto;}
.sc-ov-title{font-size:var(--u5);color:var(--gold);margin-bottom:var(--u);font-family:monospace;text-shadow:0 0 12px rgba(241,196,15,0.35);}
.sc-ov-cards{display:flex;gap:var(--u3);margin-bottom:var(--u);justify-content:center;flex-wrap:wrap;}
.sc-ov-card{width:calc(var(--cw)*0.8);height:calc(var(--ch)*0.8);background:var(--card-front);border:2px solid #aaa;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;opacity:0.25;transition:all 0.3s;flex-shrink:0;}
.sc-ov-card .r{font-size:var(--u2);}.sc-ov-card .s{font-size:var(--u4);margin-top:1px;}
.sc-ov-card.red{color:var(--red);}.sc-ov-card.black{color:#2c3e50;}
.sc-ov-card.on{opacity:1;transform:scale(1.1);border-color:var(--chip);box-shadow:0 0 14px rgba(46,174,96,0.5);}
.sc-ov-nums{display:flex;gap:var(--u);align-items:center;font-size:var(--u5);font-weight:bold;font-family:monospace;margin-bottom:var(--u);}
.sc-ov-chip{color:var(--chip);}.sc-ov-mult{color:var(--mult);}.sc-ov-eq{color:var(--text2);font-size:var(--u4);}.sc-ov-tot{color:var(--gold);}
.sc-ov-jk{font-size:var(--u);color:var(--text2);}
.sc-ov-jk .jl{padding:var(--u3) var(--u2);border-radius:3px;margin:var(--u3) 0;background:rgba(125,60,152,0.06);border:1px solid rgba(125,60,152,0.06);opacity:0;transition:opacity 0.3s;}
.sc-ov-jk .jl.on{opacity:1;}
.sc-ov-jk .jl.xmult{border-color:rgba(241,196,15,0.3);background:rgba(241,196,15,0.06);}
.sc-ov-jk .jl.chips{border-color:rgba(39,174,96,0.3);background:rgba(39,174,96,0.06);}
.sc-ov-jk .jl.mult{border-color:rgba(176,48,32,0.15);background:rgba(176,48,32,0.04);}
.sc-ov-jk .jl.chips_edition{border-color:rgba(241,196,15,0.4);background:rgba(241,196,15,0.08);}
.sc-ov-jk .jl.xmult_edition{border-color:rgba(125,60,152,0.4);background:rgba(125,60,152,0.08);}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translate(0)}10%{transform:translate(-3px,1px)}30%{transform:translate(3px,-1px)}50%{transform:translate(-1px,3px)}}
@keyframes cardIn{0%{transform:translateY(30px) scale(0.8);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes cardFlip{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 5px rgba(241,196,15,0.2)}50%{box-shadow:0 0 20px rgba(241,196,15,0.5)}}
@keyframes moneyPop{0%{transform:scale(1)}30%{transform:scale(1.3);color:#f1c40f}100%{transform:scale(1)}}
@keyframes toastIn{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes scoreBounce{0%{transform:scale(1)}30%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes jokerActivate{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.08);filter:brightness(1.3)}60%{transform:scale(0.98)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes dealSlide{0%{transform:translateX(-60px) translateY(20px) scale(0.6);opacity:0}100%{transform:translateX(0) translateY(0) scale(1);opacity:1}}
@keyframes chipFly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-40px) scale(0.5);opacity:0}}
@keyframes blindReveal{0%{transform:perspective(600px) rotateX(30deg);opacity:0;filter:blur(4px)}100%{transform:perspective(600px) rotateX(0);opacity:1;filter:blur(0)}}
.pop{animation:pop 0.2s ease}.shk{animation:shk 0.3s ease}
.card-in{animation:cardIn 0.35s ease-out}
.card-flip{animation:cardFlip 0.3s ease-out}

// ===== Web Audio 音效引擎 (Balatro原版风格) =====
var SND={ctx:null,vol:0.15};
SND.init=function(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();};
SND.resume=function(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();};
SND.play=function(t,f,d,v,w){this.init();this.resume();var _=this.ctx;var o=_.createOscillator();var g=_.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.15,_.currentTime);g.gain.exponentialRampToValueAtTime(0.001,_.currentTime+(d||0.15));if(w){o.type='triangle';var o2=_.createOscillator();o2.type='square';o2.frequency.value=f*1.5;o2.connect(g);o2.start();o2.stop(_.currentTime+d||0.15);}o.connect(g);g.connect(_.destination);o.start();o.stop(_.currentTime+d||0.15);};
// 卡牌选择音
SND.cardSel=function(){this.play('sine',880,0.06,0.12);};
// 卡牌取消选择
SND.cardDesel=function(){this.play('sine',440,0.05,0.08);};
// 出牌音
SND.playHand=function(){this.play('triangle',220,0.2,0.18,true);setTimeout(function(){SND.play('noise',0,0.05,0.04);},100);};
// 弃牌音
SND.discard=function(){this.play('sawtooth',150,0.15,0.06);};
// 购买音
SND.buy=function(){this.play('sine',1200,0.08,0.1);setTimeout(function(){SND.play('sine',1600,0.06,0.08);},60);};
// 金币增加
SND.money=function(){this.play('triangle',1800,0.1,0.08);};
// 过关音
SND.win=function(){var self=this;this.play('sine',523,0.15,0.15);setTimeout(function(){self.play('sine',659,0.12,0.15);},120);setTimeout(function(){self.play('sine',784,0.18,0.15);},240);};
// 失败音
SND.lose=function(){var self=this;this.play('sawtooth',330,0.25,0.08);setTimeout(function(){self.play('sawtooth',220,0.3,0.06);},150);};
// 小丑触发音
SND.joker=function(){this.play('sine',660,0.08,0.06);setTimeout(function(){SND.play('sine',990,0.06,0.05);},40);};
// 分数跳动
SND.score=function(){this.play('triangle',1200,0.04,0.04);};
// Toast音
SND.toast=function(){this.play('sine',600,0.05,0.04);};
// 选择盲注
SND.blind=function(){this.play('triangle',400,0.25,0.12);setTimeout(function(){SND.play('triangle',500,0.2,0.1);},150);};
// 消耗品使用
SND.consume=function(){this.play('sine',1000,0.1,0.08);setTimeout(function(){SND.play('sine',1400,0.08,0.06);},70);};
// 开包
SND.pack=function(){this.play('triangle',700,0.12,0.08);setTimeout(function(){SND.play('sine',900,0.1,0.06);},80);setTimeout(function(){SND.play('triangle',1100,0.08,0.05);},160);};
// 出牌计分音(连续多声)
SND.scoreSeq=function(n){for(var i=0;i<Math.min(n,5);i++){setTimeout(function(j){SND.play('triangle',600+j*150,0.03,0.03);},i*60,i);}};

function saveGame(){
  var data={
    a:G.a,r:G.r,money:G.money,hl:G.hl,dl:G.dl,sc:G.sc,tgt:G.tgt,
    ph:G.ph,rr:G.rr,rc:G.rc,

    stats:G.stats,roundBonusChips:G.roundBonusChips,
    dk:G.dk.map(function(c){return {rank:c.rank,suit:c.suit,enh:c.enh||null,seal:c.seal||null};}),
    hd:G.hd.map(function(c){return {rank:c.rank,suit:c.suit,enh:c.enh||null,seal:c.seal||null};}),
    lastUsedConsumable:G.lastUsedConsumable?G.lastUsedConsumable.id:null,
  };
  try{localStorage.setItem('balatro_save',JSON.stringify(data));var sv=document.getElementById('save-ind');if(sv){sv.textContent='💾 已存档';sv.style.opacity='1';setTimeout(function(){sv.style.opacity='0';},1500);}}catch(e){}
}
function loadGame(){
  try{var raw=localStorage.getItem('balatro_save');if(!raw)return false;
  var data=JSON.parse(raw);
  G={a:data.a,r:data.r,money:data.money,hl:data.hl,dl:data.dl,sc:data.sc,tgt:data.tgt,
    ph:data.ph,rr:data.rr,rc:data.rc,
    hLv:data.hLv,dk:data.dk||[],hd:data.hd||[],sel:[],jk:[],shop:[],cons:[],handCounts:data.handCounts||{},bossFn:data.bossFn||null,bossPlayedTypes:[],
    vouchers:data.vouchers||[],tags:data.tags||[],consMax:data.consMax||2,
    stats:data.stats||{handsPlayed:0,discardsUsed:0,jokersBought:0,jokersSold:0,roundsPlayed:0,highestScore:0,moneyEarned:0,tarotsUsed:0,planetsUsed:0,spectralUsed:0,packsOpened:0},
    roundBonusChips:data.roundBonusChips||0,lastUsedConsumable:null};
  // Restore jokers from IDs + editions
  if(data.jk){for(var i=0;i<data.jk.length;i++){
    var jData=data.jk[i];
    var jId=typeof jData==='object'?jData.id:jData;
    var jEd=typeof jData==='object'?jData.edition:'none';
    var jp=JP.find(function(j){return j.id===jId;});
    if(jp){var jObj=Object.assign({},jp);jObj.edition=jEd;if(jData.dyn)jObj.dyn=jData.dyn;if(jData.dynX)jObj.dynX=jData.dynX;G.jk.push(jObj);}
  }}
  // Restore consumables from IDs
  if(data.cons){for(var i=0;i<data.cons.length;i++){var c=data.cons[i];var pp=PP.find(function(p){return p.id===c.id;});var tp=TP.find(function(t){return t.id===c.id;});var sp=SP.find(function(s){return s.id===c.id;});if(c.type==='planet'&&pp)G.cons.push({type:'planet',em:c.em,n:c.n,d:c.d,data:pp});else if(c.type==='tarot'&&tp)G.cons.push({type:'tarot',em:c.em,n:c.n,d:c.d,data:tp});else if(c.type==='spectral'&&sp)G.cons.push({type:'spectral',em:c.em,n:c.n,d:c.d,data:sp});}}
  // Restore deck/hand card objects
  if(data.dk){G.dk=data.dk.map(function(c){return {rank:c.rank,suit:c.suit,enh:c.enh||null,seal:c.seal||null};});}
  if(data.hd){G.hd=data.hd.map(function(c){return {rank:c.rank,suit:c.suit,enh:c.enh||null,seal:c.seal||null};});}
  if(!G.dk.length)bd();
  return true;
  }catch(e){return false;}
}

function bd(){G.dk=[];for(var i=0;i<S.length;i++)for(var j=0;j<R.length;j++){var card={rank:R[j],suit:S[i],enh:null,seal:null};G.dk.push(card);}}
function sf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}
function dh(){G.hd=[];G.sel=[];d8();}
function d8(){G._dealAnim=true;var maxSize=8+G.jk.filter(function(j){return j.ef&&j.ef.t==='effect'&&j.ef.sub==='addHandSize';}).length;if(G.bossFn==='manacle')maxSize=Math.max(1,maxSize-1);while(G.hd.length<maxSize){if(!G.dk.length){bd();sf(G.dk);}G.hd.push(G.dk.shift());}

function ev(cards){
  if(!cards||!cards.length)return 'High Card';
  var vs=cards.map(c=>V[c.rank]).sort((a,b)=>a-b),ss=cards.map(c=>c.suit);
  var rc={};cards.forEach(c=>rc[c.rank]=(rc[c.rank]||0)+1);
  var ct=[];for(var k in rc)ct.push(rc[k]);ct.sort((a,b)=>b-a);
  // 规则型小丑：检查是否有 fourFingers/shortcut/pareidolia/splash
  var hasFF=G.jk.some(function(j){return j.ef&&j.ef.t==='effect'&&j.ef.sub==='fourFingers';});
  var hasSC=G.jk.some(function(j){return j.ef&&j.ef.t==='effect'&&j.ef.sub==='shortcut';});
  var hasPar=G.jk.some(function(j){return j.ef&&j.ef.t==='effect'&&j.ef.sub==='pareidolia';});
  var hasSplash=G.jk.some(function(j){return j.ef&&j.ef.t==='effect'&&j.ef.sub==='splash';});

  var minStraight=hasFF?4:5; // 四指：顺子只需4张
  var minFlush=hasFF?4:5;    // 四指：同花只需4张

  var isF=cards.length>=minFlush&&ss.every(function(s){return s===ss[0];}),isS=false;
  if(cards.length>=minStraight){
    var v=[...new Set(vs)].sort(function(a,b){return a-b;});
    // 捷径(shortcut)：顺子允许间隔1级
    var maxGap=hasSC?2:1;
    if(v.length>=minStraight){
      for(var s=0;s<=v.length-minStraight;s++){
        var ok=true,gaps=0;
        for(var i=s+1;i<s+minStraight+s&&i<v.length;i++){
          var gap=v[i]-v[i-1];
          if(gap>maxGap){ok=false;break;}
        }
        // 需要连续minStraight-1个间隔都在maxGap内
        var seqLen=0,cur=v[s];
        for(var i=s;i<v.length;i++){
          if(v[i]-cur<=maxGap){seqLen++;cur=v[i];}
          else break;
        }
        if(seqLen>=minStraight)isS=true;
      }
    }
    if(!isS&&vs.includes(14)){var v2=vs.map(function(x){return x===14?1:x;}).sort(function(a,b){return a-b;});var u2=[...new Set(v2)].sort(function(a,b){return a-b;});
      if(u2.length>=minStraight){
        for(var s=0;s<=u2.length-minStraight;s++){
          var seqLen=0,cur=u2[s];
          for(var i=s;i<u2.length;i++){
            if(u2[i]-cur<=maxGap){seqLen++;cur=u2[i];}
            else break;
          }
          if(seqLen>=minStraight)isS=true;
        }
      }
    }
  }
  var isR=isF&&isS&&vs.includes(14)&&vs.includes(13)&&vs.includes(12);
  if(isF&&isS)return isR?'Royal Flush':'Straight Flush';if(ct[0]===4)return 'Four of a Kind';if(ct[0]===3&&ct[1]>=2)return 'Full House';
  if(isF)return 'Flush';if(isS)return 'Straight';if(ct[0]===3)return 'Three of a Kind';if(ct[0]===2&&ct[1]>=2)return 'Two Pair';
  if(ct[0]===2)return 'Pair';return 'High Card';
}

function hc(t,l){
  var base=HT[t]?HT[t].c:0;
  // Find matching PP for lvChips
  var pp=PP.find(function(p){return p.h===t});
  var lvC=pp?pp.lvChips:(HT[t]?HT[t].lc:0);
  return base+lvC*l;
}
function hm(t,l){
  var base=HT[t]?HT[t].m:0;
  var pp=PP.find(function(p){return p.h===t});
  var lvM=pp?pp.lvMult:(HT[t]?HT[t].lm:0);
  return base+lvM*l;
}

function useCons(idx){
  if(idx>=G.cons.length||anim)return;
  SND.consume();
  var c=G.cons[idx];
  if(c.type==='planet'){
    G.hLv[c.data.h]++;
    toast(HZ[c.data.h]+'升至Lv.'+(G.hLv[c.data.h]+1));
    G.cons.splice(idx,1);G.stats.planetsUsed++;G.lastUsedConsumable=c.data;
  }else if(c.type==='tarot'){
    at2Select(c.data);
    G.cons.splice(idx,1);G.stats.tarotsUsed++;G.lastUsedConsumable=c.data;
  }else if(c.type==='spectral'){
    useSpectral(c.data);
    G.cons.splice(idx,1);G.stats.spectralUsed++;G.lastUsedConsumable=c.data;
  }
  rr();rrCons();saveGame();
}

function ph(){
  if(G.sel.length===0||G.hl===0||anim)return;
  SND.playHand();
  var sc=G.sel.map(function(i){return G.hd[i];});
  var ht=ev(sc);
  // Boss眼睛：不能重复打出同一牌型
  if(G.bossFn==='eye'&&G.bossPlayedTypes&&G.bossPlayedTypes.indexOf(ht)>=0){toast('👁 眼睛：不能重复打 '+HZ[ht]+'!');anim=false;return;}
  if(G.bossPlayedTypes)G.bossPlayedTypes.push(ht);
  anim=true;G.hl--;G.stats.handsPlayed++;
  var res=jfxSeq(sc,ht);

  var ov=document.createElement('div');ov.className='ov';
  var lv=G.hLv[ht],lt=lv>0?' Lv.'+(lv+1):'';
  var baseC=hc(ht,lv),baseM=hm(ht,lv);
  var ch='';
  for(var i=0;i<sc.length;i++)ch+='<div class="sc-ov-card '+ (SR[sc[i].suit]?'red':'black')+'"><span class="r">'+sc[i].rank+'</span><span class="s">'+sc[i].suit+'</span></div>';
  ov.innerHTML='<div class="sc-ov-title">'+HZ[ht]+lt+'</div><div class="sc-ov-cards">'+ch+'</div><div class="sc-ov-nums"><span class="sc-ov-chip" id="soCh">'+baseC+'</span><span class="sc-ov-eq">×</span><span class="sc-ov-mult" id="soMu">'+baseM+'</span><span class="sc-ov-eq">=</span><span class="sc-ov-tot" id="soTo">'+Math.round(baseC*baseM)+'</span></div><div class="sc-ov-jk" id="soJk"></div>';
  document.body.appendChild(ov);

  var scC=ov.querySelectorAll('.sc-ov-card');
  var curC=baseC,ci=0;
  setTimeout(function(){scN();},250);

  function scN(){
    if(ci>=sc.length){shJ();return;}
    scC[ci].classList.add('on');curC+=V[sc[ci].rank];
    SND.play('triangle',300+V[sc[ci].rank]*30,0.04,0.04);
    document.getElementById('soCh').textContent=curC;document.getElementById('soCh').classList.add('pop');
    document.getElementById('soTo').textContent=Math.round(curC*baseM);
    setTimeout(function(){document.getElementById('soCh').classList.remove('pop');scC[ci].classList.remove('on');ci++;setTimeout(scN,120);},180);
  }

  function shJ(){
    var jh='';
    res.steps.forEach(function(step){
      var j=step.joker,txt=jfxDesc(j,sc,ht);
      var edLabel='';
      if(step.type==='chips_edition')edLabel=' [闪烁+50筹码]';
      else if(step.type==='xmult_edition'){
        if(j.edition==='holographic')edLabel=' [全息×1.5]';
        else if(j.edition==='polychrome')edLabel=' [多彩×3]';
      }
      jh+='<div class="jl '+step.type+'">#'+(G.jk.indexOf(j)+1)+' '+j.em+' '+j.n+': '+txt+edLabel+'</div>';
    });
    document.getElementById('soJk').innerHTML=jh;
    var lines=ov.querySelectorAll('.jl');var li=0;
    if(!lines.length){fin();return;}
    function nxt(){
      if(li>=lines.length){fin();return;}
      lines[li].classList.add('on');
      var sC=res.steps[li].chips,sM=res.steps[li].mult;
      document.getElementById('soCh').textContent=sC;
      document.getElementById('soMu').textContent=sM%1===0?sM:sM.toFixed(1);
      if(res.steps[li].type==='xmult')document.getElementById('soMu').classList.add('pop');
      document.getElementById('soTo').textContent=res.steps[li].total;
      SND.joker();
      li++;setTimeout(nxt,300);
    }
    nxt();
  }

  function fin(){
    document.getElementById('soTo').textContent=res.total;document.getElementById('soTo').classList.add('pop');
    setTimeout(function(){document.getElementById('soTo').classList.remove('pop');
      if(res.total>=200){document.getElementById('game-wrap').classList.add('shk');setTimeout(function(){document.getElementById('game-wrap').classList.remove('shk');aft(res.total);},300);}
      else aft(res.total);
    },400);
  }

  function aft(fs){
    G.sc+=fs;G.hd=G.hd.filter(function(_,i){return !G.sel.includes(i);});
    // 牌型计数(supernova用)
    if(!G.handCounts)G.handCounts={};
    G.handCounts[ht]=(G.handCounts[ht]||0)+1;
    // scaling 类小丑增长
    G.jk.forEach(function(j){
      if(j.ef&&j.ef.t==='effect'){
        if(j.ef.sub==='scalingMult'){
          if(j.id==='j44'&&!sc.some(function(c){var r=c.rank;return r==='J'||r==='Q'||r==='K'||r==='A';})){j.dyn=(j.dyn||0)+1;}
          else if(j.id==='j58'){j.dyn=(j.dyn||0)+1;}
          else if(j.id==='j98'&&ht==='Two Pair'){j.dyn=(j.dyn||0)+2;}
        }
        else if(j.ef.sub==='scalingChips'){
          if(j.id==='j49'&&ht==='Straight'){j.dyn=(j.dyn||0)+15;}
          else if(j.id==='j65'&&sc.length===4){j.dyn=(j.dyn||0)+4;}
        }
        else if(j.ef.sub==='scalingXMult'){
          if(j.id==='j55'){j.dynX=(j.dynX||1)+0.1;}
          else if(j.id==='j68'&&sc.some(function(c){return c.enh;})){j.dynX=(j.dynX||1)+0.1;}
          else if(j.id==='j70'){j.dynX=(j.dynX||1)+0.25;}
          else if(j.id==='j105'){j.dynX=(j.dynX||1)+0.25;}
        }
        else if(j.ef.sub==='loyaltyCard'){j.dyn=(j.dyn||0)+1;}
        // decay: 冰淇淋出牌时衰减
        else if(j.ef.sub==='decayChips'){j.dyn=(j.dyn||100)-5;if(j.dyn<=0)j.dyn=0;}
      }
    });
    // 移除已衰减到0的小丑
    G.jk=G.jk.filter(function(j){return !(j.ef&&j.ef.t==='effect'&&j.ef.sub==='decayChips'&&j.dyn<=0);});
    G.sel=[];ov.remove();
    if(G.sc>=G.tgt){anim=false;wr();return;}
    if(G.hl===0){anim=false;lr();return;}
    // Boss蛇：补牌到3而非8
    if(G.bossFn==='serpent'){while(G.hd.length<3){if(!G.dk.length){bd();sf(G.dk);}G.hd.push(G.dk.shift());}toast('🐍 蛇:补牌至3张');}
    else{d8();}
    rf();anim=false;rr();
  }
}

function gs(){
  G.shop=[];
  function rollEdition(){
    var r=Math.random()*100;
    if(r<0.3)return 'negative';if(r<0.6)return 'polychrome';if(r<5)return 'holographic';if(r<14)return 'foil';return 'none';
  }
  var edNames={none:'',foil:'闪烁',holographic:'全息',polychrome:'多彩',negative:'负片'};
  var edIcons={none:'',foil:'🌟',holographic:'✨',polychrome:'🌈',negative:'💀'};
  var edDescs={none:'',foil:'+50筹码',holographic:'×1.5乘数',polychrome:'×3乘数',negative:'不占槽位'};
  var basePrice=3+G.a;
  // 凭证折扣
  var hasClearance=G.vouchers.indexOf('v_clearance')>=0;
  var hasMerchant=G.vouchers.indexOf('v_merchant')>=0;
  var discount=hasClearance?0.5:1;
  if(hasMerchant)basePrice=Math.max(1,basePrice-2);
  // 过剩凭证：商店物品+1
  var overstockCount=G.vouchers.filter(function(v){return v==='v_overstock';}).length;
  // 重滚凭证
  var rerollCount=G.vouchers.filter(function(v){return v==='v_reroll';}).length;
  G.rr=2+rerollCount;G.rc=Math.round((5+G.a)*discount);
  // 标签经济：商店价格-$2
  var hasEconTag=G.tags.indexOf('tg_economy')>=0;

  // Jokers: 2+overstock from pool
  var jp=JP.filter(function(j){return !G.jk.find(function(jj){return jj.id===j.id})&&j.r!=='l';});
  sf(jp);var jc=Math.min(2+overstockCount,jp.length);
  for(var i=0;i<jc;i++){
    var j=jp[i],p=Math.round((j.r==='c'?3+Math.floor(Math.random()*3):j.r==='u'?5+Math.floor(Math.random()*4):8)*discount);
    if(hasEconTag)p=Math.max(1,p-2);
    var ed=rollEdition();
    if(ed==='foil')p+=2;if(ed==='holographic')p+=4;if(ed==='polychrome')p+=8;if(ed==='negative')p+=5;
    var edSuffix=ed==='none'?'':edIcons[ed]+' '+edNames[ed]+'('+edDescs[ed]+')';
    G.shop.push({type:'joker',em:j.em,n:j.n,d:j.d+(edSuffix?' · '+edSuffix:''),price:p,data:j,sold:false,edition:ed});
  }
  // 强化包系统：1-2个包
  var packTypes=[
    {type:'pack',packType:'buffoon',em:'🃏',n:'小丑包',d:'开包获得2个随机小丑选择1个',price:Math.round(4*discount)},
    {type:'pack',packType:'arcana',em:'🔮',n:'塔罗包',d:'开包获得2-3张塔罗牌选择1张',price:Math.round(4*discount)},
    {type:'pack',packType:'celestial',em:'🌍',n:'星球包',d:'开包获得2-3张星球牌选择1张',price:Math.round(4*discount)},
    {type:'pack',packType:'spectral',em:'👻',n:'幽灵包',d:'开包获得1-2张幽灵牌选择1张',price:Math.round(6*discount)},
  ];
  sf(packTypes);var packCount=Math.min(1+(G.a>2?1:0),packTypes.length);
  for(var i=0;i<packCount;i++){
    var pt=packTypes[i];
    if(hasEconTag)pt.price=Math.max(1,pt.price-2);
    G.shop.push({type:'pack',em:pt.em,n:pt.n,d:pt.d,price:pt.price,sold:false,packType:pt.packType});
  }
  // Planets: 1
  var pp=[...PP];sf(pp);var pc=Math.min(1,pp.length);
  for(var i=0;i<pc;i++){
    var p=pp[i],pr=Math.round((3+G.a)*discount);
    var hasHone=G.vouchers.indexOf('v_hone')>=0;if(hasHone)pr=Math.max(1,pr-1);
    if(hasEconTag)pr=Math.max(1,pr-2);
    var lv=G.hLv[p.h]+1;
    G.shop.push({type:'planet',em:p.em,n:p.n,d:HZ[p.h]+' Lv.'+(lv+1)+'(+'+p.lvChips+'筹码/+'+p.lvMult+'乘数)',price:pr,data:p,sold:false});
  }
  // Tarots: 1
  var tp=[...TP];sf(tp);var tc=Math.min(1,tp.length);
  for(var i=0;i<tc;i++){
    var t=tp[i],pr=Math.round((3+G.a)*discount);
    if(hasEconTag)pr=Math.max(1,pr-2);
    G.shop.push({type:'tarot',em:t.em,n:t.n,d:t.d,price:pr,data:t,sold:false});
  }
  // 凭证：1-2个(每2轮出现一次)
  if(G.stats.roundsPlayed%2===0||G.a>=2){
    var vp=[...VC].filter(function(v){return G.vouchers.indexOf(v.id)<0||v.stackable;});
    sf(vp);var vCount=Math.min(1+(G.a>3?1:0),vp.length);
    for(var i=0;i<vCount;i++){
      var v=vp[i],vpr=Math.round(v.cost*discount);
      if(hasEconTag)vpr=Math.max(1,vpr-2);
      G.shop.push({type:'voucher',em:v.em,n:v.n,d:v.d+(v.stackable?' (可叠加)':' (不可叠加)'),price:vpr,data:v,sold:false});
    }
  }
  // 清除经济标签(一次性)
  if(hasEconTag){var idx=G.tags.indexOf('tg_economy');if(idx>=0)G.tags.splice(idx,1);}
}

function bi(idx){
  var it=G.shop[idx];if(it.sold||G.money<it.price)return;
  SND.buy();
  G.money-=it.price;it.sold=true;G.stats.moneyEarned+=it.price;
  if(it.type==='joker'){
    var jObj=Object.assign({},it.data);jObj.edition=it.edition||'none';
    G.jk.push(jObj);G.stats.jokersBought++;
    var edMsg=jObj.edition==='none'?'':({foil:' 闪烁版',holographic:' 全息版',polychrome:' 多彩版',negative:' 负片版'}[jObj.edition]);
    toast('获得 '+it.n+edMsg);
  }
  else if(it.type==='planet'){if(G.cons.length<G.consMax){G.cons.push({type:'planet',em:it.em,n:it.n,data:it.data,d:it.d});toast(it.n+' 放入消耗槽');}else{toast('消耗槽已满('+G.consMax+')');return;}}
  else if(it.type==='tarot'){if(G.cons.length<G.consMax){G.cons.push({type:'tarot',em:it.em,n:it.n,data:it.data,d:it.d});toast(it.n+' 放入消耗槽');}else{toast('消耗槽已满('+G.consMax+')');return;}}
  else if(it.type==='voucher'){
    G.vouchers.push(it.data.id);
    if(it.data.id==='v_clearance'||it.data.id==='v_merchant')toast(it.n+': 价格折扣已生效');
    else if(it.data.id==='v_reroll')toast(it.n+': 重滚次数+1');
    else if(it.data.id==='v_overstock')toast(it.n+': 下次商店物品+1');
    else if(it.data.id==='v_tarot'||it.data.id==='v_planet'){G.consMax++;toast(it.n+': 消耗槽位+1→'+G.consMax);}
    else if(it.data.id==='v_hone')toast(it.n+': 星球牌售价-$1');
    else if(it.data.id==='v_interest'||it.data.id==='v_ante')toast(it.n+': 利息上限+1');
    else if(it.data.id==='v_hustle')toast(it.n+': 每轮+$2');
    else toast(it.n+' 已激活');
  }
  else if(it.type==='pack'){openPack(it.packType);return;}
  rsh();rrCons();saveGame();
}

  var h='<div style="font-size:var(--u5);color:var(--gold);font-weight:bold;font-family:monospace;margin-bottom:var(--u4);text-shadow:0 0 10px rgba(241,196,15,0.3)">🎮 操作指南</div>';
  h+='<div style="max-width:360px;font-size:var(--u3);color:var(--text2);line-height:1.6">';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🃏 出牌</span> — 点击手牌选中(最多5张)，点击「出牌」打出</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🗑 弃牌</span> — 选中牌后点击「弃牌」，换新牌进来</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🛒 商店</span> — 通过盲注后进入商店，购买小丑/星球/塔罗/强化包</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">👁 小丑详情</span> — 点击小丑查看详情和卖出选项</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🔮 消耗品</span> — 星球牌直接升级牌型，塔罗牌点击消耗槽使用(可自选目标牌)</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🪝 Boss盲注</span> — 每Ante有Boss特殊效果，小心应对</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">⏭ 跳过盲注</span> — 可跳过小/大盲注换取金币+标签奖励</div>';
  h+='<div style="margin-bottom:var(--u3)"><span style="color:var(--gold)">🎯 目标</span> — 每轮打出牌达到目标分数即可通过，进入下一Ante</div>';
  h+='</div>';
  h+='<button class="sb sb-c" id="tutOk" style="margin-top:var(--u4)">开始游戏</button>';
  ov.innerHTML=h;document.body.appendChild(ov);
  document.getElementById('tutOk').addEventListener('click',function(){ov.remove();localStorage.setItem('balatro_tut','1');});
}
function sl(){document.getElementById('start').style.display='none';if(loadGame()){rr();}else{init();rr();}}
function toggleLandscape(){var b=document.body,btn=document.getElementById('landscape-toggle');
  if(b.classList.contains('force-landscape')){b.classList.remove('force-landscape');btn.textContent='🔄 横屏';}
  else{b.classList.add('force-landscape');btn.textContent='↩️ 恢复';}rr();
}

// ===== 音量开关 =====
var SND_MUTED=false;
SND.play=function(t,f,d,v,w){if(SND_MUTED)return;this.init();this.resume();var _=this.ctx;var o=_.createOscillator();var g=_.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.15,_.currentTime);g.gain.exponentialRampToValueAtTime(0.001,_.currentTime+(d||0.15));if(w){var o2=_.createOscillator();o2.type='square';o2.frequency.value=f*1.5;o2.connect(g);o2.start();o2.stop(_.currentTime+d||0.15);}o.connect(g);g.connect(_.destination);o.start();o.stop(_.currentTime+d||0.15);};
document.getElementById('mute-btn').addEventListener('click',function(){SND_MUTED=!SND_MUTED;this.textContent=SND_MUTED?'🔇':'🔊';if(!SND_MUTED)SND.init();});
document.getElementById('restart-btn').addEventListener('click',function(){if(confirm('确定要重新开始吗？当前进度会丢失。')){localStorage.removeItem('balatro_save');rg();}});

// ===== 控制台系统 =====
var cheatMode=false;
var cheatInput='';
var CHEAT_PASSWORD='mawenxuan';
document.addEventListener('keydown',function(ev){
  // 只处理字母键
  if(ev.key.length===1&&/[a-zA-Z]/.test(ev.key)){
    cheatInput+=ev.key.toLowerCase();
    // 保留最近密码长度的字符
    if(cheatInput.length>CHEAT_PASSWORD.length){
      cheatInput=cheatInput.slice(-CHEAT_PASSWORD.length);
    }
    // 检查密码匹配
    if(cheatInput===CHEAT_PASSWORD){
      cheatMode=!cheatMode;
      cheatInput='';
      if(cheatMode){
        G.money+=999;G.stats.moneyEarned+=999;toast('⚡ +$999');
        rr();rrCons();
      }else{
        toast('⚡ 已关闭');
      }
    }
  }else if(ev.key==='Escape'&&cheatMode){
    cheatMode=false;toast('⚡ 已关闭');
  }
});
// 测试模式：每次购买前补充金币
var origBi=bi;
bi=function(idx){
  if(cheatMode&&G.money<G.shop[idx].price){
    G.money+=999;G.stats.moneyEarned+=999;toast('⚡ +$999');
  }
  origBi(idx);
};
// 测试模式：每次出牌前补充出牌数
var origPh=ph;
ph=function(){
  if(cheatMode&&G.hl<=0){G.hl+=5;toast('⚡ +5手牌');}
  origPh();
};
